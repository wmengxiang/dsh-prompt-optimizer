name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: syntax & contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check (host half)
        run: node --check lib/index.js
      - name: Syntax check (client half)
        run: node --check lib/client.js
      - name: Contract tests
        run: node --test test/contract.test.mjs
